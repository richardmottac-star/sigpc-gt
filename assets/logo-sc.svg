<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="520" height="110">
  <!-- Bandeira SC -->
  <rect x="0" y="0" width="175" height="110" fill="white"/>
  <!-- Faixa vermelha superior -->
  <rect x="0" y="0" width="175" height="36" fill="#C8102E"/>
  <!-- Faixa branca central -->
  <rect x="0" y="36" width="175" height="38" fill="white"/>
  <!-- Faixa vermelha inferior -->
  <rect x="0" y="74" width="175" height="36" fill="#C8102E"/>
  <!-- Losango verde -->
  <polygon points="87,4 171,55 87,106 3,55" fill="#009B3A"/>
  <!-- Estrela branca central (simplificada) -->
  <circle cx="87" cy="55" r="22" fill="white" opacity="0.9"/>
  <!-- Detalhes da estrela/escudo SC -->
  <text x="87" y="62" font-family="serif" font-size="22" font-weight="900" fill="#C8102E" text-anchor="middle">SC</text>
  <!-- Linha separadora -->
  <rect x="185" y="8" width="2" height="94" fill="#333" opacity="0.3"/>
  <!-- Texto: GOVERNO DE -->
  <text x="205" y="36" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#333" letter-spacing="5">GOVERNO DE</text>
  <!-- Texto: SANTA CATARINA -->
  <text x="200" y="72" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#1a1a1a">SANTA</text>
  <text x="200" y="108" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#1a1a1a">CATARINA</text>
</svg>
